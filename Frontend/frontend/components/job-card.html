<!-- Reusable Job Card HTML Template Snippet -->
<template id="job-card-template">
  <div class="job-card-root bg-white rounded-xl border border-slate-200/90 hover:border-brand-300 p-5 shadow-xs hover:shadow-md transition-all group">
    <div class="flex flex-col sm:flex-row items-start justify-between gap-4">
      <div class="flex items-start gap-4">
        <div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-100 border border-slate-200 shrink-0">
          <img class="job-logo w-full h-full object-cover group-hover:scale-105 transition-transform" src="" alt="" />
        </div>
        <div class="space-y-1.5">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="job-title text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors"></h3>
            <span class="job-match text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200"></span>
          </div>
          <p class="job-company text-xs font-bold text-slate-700"></p>

          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-600">
            <span class="flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
              <span class="job-location"></span>
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="briefcase" class="w-3.5 h-3.5 text-slate-400"></i>
              <span class="job-exp"></span>
            </span>
            <span class="job-salary font-semibold text-amber-700"></span>
          </div>

          <div class="job-skills flex flex-wrap gap-1.5 pt-2"></div>
        </div>
      </div>

      <div class="flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto gap-3 pt-2 sm:pt-0 shrink-0">
        <button type="button" class="bookmark-btn p-2 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-slate-100 cursor-pointer transition-colors" title="Bookmark job">
          <i data-lucide="bookmark" class="w-5 h-5"></i>
        </button>
        <button type="button" class="apply-btn btn-polish bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs px-5 py-2.5 rounded-xl cursor-pointer">
          Apply Now
        </button>
      </div>
    </div>
  </div>
</template>
