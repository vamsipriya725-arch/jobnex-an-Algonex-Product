<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore verified AI, Engineering, Data, and Cloud roles across India, US, and Global." />
  <title>Jobs Directory | JobNex</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f4f5fb',
              100: '#eaebf6',
              200: '#d5d9ee',
              300: '#bac0e1',
              400: '#9ba3d2',
              500: '#7c85be',
              600: '#646ca6',
              700: '#505787',
              800: '#3e4268',
              900: '#2e3049',
              950: '#1f2030',
            },
            royal: '#646ca6',
            'royal-deep': '#505787',
            cream: '#eaebf6',
            sage: '#bac0e1',
            'pink-soft': '#ebabbb',
            'amber-accent': '#ebabbb',
            page: '#3e4268',
            navy: '#3e4268',
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Project Styles -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-[#eaebf6] text-[#2b2e3e] flex flex-col min-h-screen">
  <!-- Reusable Navigation -->
  <div id="navbar-container"></div>

  <!-- Main Container -->
  <main class="flex-1 max-w-[1440px] mx-auto w-full px-4 sm:px-6 py-6 space-y-6">
    <!-- Search Bar Banner -->
    <div class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200/90 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <form id="job-search-form" class="flex-1 flex items-center gap-3 w-full">
        <div class="flex-1 flex items-center gap-2.5 px-3.5 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus-within:border-brand-500 transition-all">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
          <input id="job-keyword-input" type="text" placeholder="Search title, skills (React, Python), or company..." class="w-full text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none bg-transparent font-medium" />
        </div>
        <button type="submit" class="btn-polish bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs px-5 py-3 rounded-xl cursor-pointer">
          Find Jobs
        </button>
      </form>

      <button id="mobile-filters-btn" type="button" class="sm:hidden flex items-center gap-2 text-xs font-semibold px-3 py-2 bg-slate-100 rounded-lg text-slate-700 w-full justify-center">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
        <span>Filters</span>
      </button>
    </div>

    <!-- 2-Column Content: Sidebar Filters & Results List -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
      <!-- Left Filters Sidebar -->
      <aside id="sidebar-filters" class="hidden sm:block lg:col-span-1 bg-white rounded-xl p-5 border border-slate-200 shadow-xs space-y-6">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h3 class="font-bold text-sm text-slate-900">Filters</h3>
          <span id="jobs-count-text" class="text-xs font-semibold text-brand-600">Loading...</span>
        </div>

        <!-- Region -->
        <div class="space-y-2.5">
          <label class="text-xs font-bold text-slate-700 block uppercase tracking-wider">Region</label>
          <div class="space-y-2 text-xs text-slate-600">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="INDIA" class="region-filter-cb rounded text-brand-600" />
              <span>India</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="US" class="region-filter-cb rounded text-brand-600" />
              <span>US / Remote</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="GLOBAL" class="region-filter-cb rounded text-brand-600" />
              <span>Global Remote</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="BANGLADESH" class="region-filter-cb rounded text-brand-600" />
              <span>Bangladesh</span>
            </label>
          </div>
        </div>

        <!-- Experience Level -->
        <div class="space-y-2.5 pt-3 border-t border-slate-100">
          <label class="text-xs font-bold text-slate-700 block uppercase tracking-wider">Experience Level</label>
          <div class="space-y-2 text-xs text-slate-600">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Fresher" class="exp-filter-cb rounded text-brand-600" />
              <span>Fresher</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="1-2 yrs" class="exp-filter-cb rounded text-brand-600" />
              <span>1–2 yrs</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="3-5 yrs" class="exp-filter-cb rounded text-brand-600" />
              <span>3–5 yrs</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="5+ yrs" class="exp-filter-cb rounded text-brand-600" />
              <span>5+ yrs</span>
            </label>
          </div>
        </div>

        <!-- Certifications -->
        <div class="space-y-2.5 pt-3 border-t border-slate-100">
          <label class="text-xs font-bold text-slate-700 block uppercase tracking-wider">Certifications</label>
          <div class="space-y-2 text-xs text-slate-600">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="AWS" class="cert-filter-cb rounded text-brand-600" />
              <span>AWS Certified</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Google Cloud" class="cert-filter-cb rounded text-brand-600" />
              <span>Google Cloud</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="PMP" class="cert-filter-cb rounded text-brand-600" />
              <span>PMP / Agile</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Others" class="cert-filter-cb rounded text-brand-600" />
              <span>Others</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Right Job Listings -->
      <section class="lg:col-span-3 space-y-4">
        <div class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200/90 text-xs text-slate-600">
          <span class="font-semibold text-slate-800">Job Listings</span>
          <div class="flex items-center gap-2">
            <span class="text-slate-400">Sort by:</span>
            <select id="sort-by-select" class="font-semibold text-slate-700 bg-transparent outline-none cursor-pointer">
              <option value="relevance">Highest Match</option>
              <option value="salary">Top Salary</option>
              <option value="date">Most Recent</option>
            </select>
          </div>
        </div>

        <div id="jobs-list-container" class="space-y-4">
          <!-- Rendered dynamically by jobs.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Apply Modal Dialog -->
  <div id="apply-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-in fade-in">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 id="modal-job-title" class="text-base font-bold text-slate-900">Job Title</h3>
          <p id="modal-job-company" class="text-xs text-slate-500">Company Name</p>
        </div>
        <button id="modal-close-btn" type="button" class="text-slate-400 hover:text-slate-800 p-1 cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="modal-apply-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Attached Resume</label>
          <div class="flex items-center justify-between p-3 bg-brand-50 rounded-xl border border-brand-200 text-xs">
            <div class="flex items-center gap-2 text-brand-800 font-semibold">
              <i data-lucide="file-text" class="w-4 h-4 text-brand-600"></i>
              <span id="jobs-modal-resume-name">Active_Resume.pdf</span>
            </div>
            <span class="text-[10px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded-full">Vector Ready</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Cover Note / Highlights</label>
          <textarea rows="4" placeholder="Briefly describe why your experience is a great fit for this team..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 outline-none focus:border-brand-500"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
          <button id="modal-cancel-btn" type="button" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900 cursor-pointer">
            Cancel
          </button>
          <button type="submit" class="btn-polish bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs px-5 py-2.5 rounded-xl cursor-pointer">
            Submit Application
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Reusable Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="../data/mock-data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/jobs.js"></script>
</body>
</html>
