name: Docker CI & Health Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker compose build

      - name: Start Container with Compose
        run: |
          docker compose up -d

      - name: Wait for Service Healthcheck
        run: |
          echo "Waiting for JobNex service to become healthy..."
          timeout 60s bash -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
          echo "Service is healthy and responding with HTTP 200!"

      - name: View Container Logs
        if: always()
        run: |
          docker compose logs

      - name: Stop Container
        if: always()
        run: |
          docker compose down

